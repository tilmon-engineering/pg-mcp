# Shared safety limits. Profiles may override any of these values.
[defaults]
max_handles = 16                  # 1..128
outstanding_requests = 32         # 1..1024 per handle
sql_bytes = 65536                 # 1..1048576
parameters = 256                  # 0..65535
parameter_bytes = 1048576         # 0..16777216 aggregate non-null UTF8 bytes
result_rows = 1000                # 1..100000; schema objects count aggregate units
columns = 256                     # 1..1600
cell_bytes = 1048576              # 1..16777216
result_json_bytes = 8388608       # 1024..67108864, entire canonical result
request_timeout_seconds = 30      # 1..300
connection_timeout_seconds = 10   # 1..300, complete open/setup sequence
cancel_drain_grace_seconds = 5    # 1..300
shutdown_total_seconds = 10       # 1..300, all workers together

# The dsn value is executed by bash -c at open_database time. Its stdout is
# treated as the libpq DSN, so environment variables and command substitutions
# can be supplied by a secrets manager without storing credentials here.
[profiles.local]
dsn = "printf 'host=127.0.0.1 port=55432 user=postgres password=postgres dbname=postgres'"

