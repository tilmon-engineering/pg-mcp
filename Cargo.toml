[workspace]
members = ["crates/postgres-mcp-core", "crates/postgres-mcp", "crates/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "signal", "net"] }
tokio-util = "0.7"
tracing = "0.1"
toml = "1"
libc = "0.2"
pq-sys = "=0.7.5"
rmcp = { version = "=1.7.0", features = ["server", "macros", "schemars", "transport-io"] }
# Keep macro expansion matched to rmcp 1.7's runtime schema helper API.
rmcp-macros = "=1.7.0"
